<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ИИ-Открытка: Персональное Поздравление!</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
  <canvas id="neuralCanvas" aria-hidden="true"></canvas>
  <div class="container">
    <div id="statusAnnouncer" class="sr-only" aria-live="polite"></div>
    <h1>Создай ИИ-Открытку!</h1>
    <div class="form-group">
      <label for="recipientName" class="sr-only">Имя получателя</label>
      <input type="text" id="recipientName" placeholder="Имя получателя" maxlength="20" aria-describedby="nameCharCounter">
      <br>
      <small id="nameCharCounter" aria-live="polite">0 / 20</small>
    </div>
    <div class="form-group">
      <label for="customWish" class="sr-only">Ваше пожелание</label>
      <input type="text" id="customWish" placeholder="Ваше пожелание" maxlength="100" aria-describedby="wishCharCounter">
      <br>
      <small id="wishCharCounter" aria-live="polite">0 / 100</small>
    </div>
    <div class="form-group">
      <label for="hobbies" class="sr-only">Хобби и интересы</label>
      <input type="text" id="hobbies" list="hobbySuggestions" placeholder="Хобби/интересы (например, программирование, игры)" maxlength="50" aria-describedby="hobbiesCharCounter">
      <datalist id="hobbySuggestions">
        <option value="программирование">
        <option value="игры">
        <option value="музыка">
        <option value="спорт">
        <option value="рисование">
      </datalist>
      <br>
      <small id="hobbiesCharCounter" aria-live="polite">0 / 50</small>
    </div>
    <div class="form-group">
      <label for="themeSelect" class="sr-only">Выберите тему</label>
      <select id="themeSelect">
        <option value="blue-purple">Сине-Фиолетовый Градиент</option>
        <option value="red-orange">Красно-Оранжевый Градиент</option>
        <option value="green-blue">Зелёно-Синий Градиент</option>
        <option value="pink-cyan">Розово-Голубой Градиент</option>
        <option value="purple-gold">Фиолетово-Золотой Градиент</option>
        <option value="teal-magenta">Бирюзово-Малиновый Градиент</option>
        <option value="sunset">Закатный Градиент</option>
      </select>
    </div>
    <div class="form-group">
      <label for="textAnimation" class="sr-only">Выберите анимацию текста</label>
      <select id="textAnimation">
        <option value="glitch">Glitch (Пиксельный сбой)</option>
        <option value="typewriter">Typewriter (Печатная машинка)</option>
        <option value="neon">Neon (Неоновое свечение)</option>
        <option value="pixel-pulse">Pixel Pulse (Пиксельный пульс)</option>
      </select>
    </div>
    <button class="btn" id="generateBtn" onclick="generateCard()">Создать Открытку!</button>
    <button id="downloadBtn" class="btn" onclick="downloadCard()" disabled title="Сначала создайте открытку">Скачать Открытку</button>
    <canvas id="cardCanvas" width="600" height="400" role="img" aria-label="Превью вашей открытки"></canvas>
    </div>

    <script src="script.js"></script>
</body>
</html>
