<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ИИ-Открытка: Персональное Поздравление!</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
  <canvas id="neuralCanvas"></canvas>
  <div class="container">
    <h1>Создай ИИ-Открытку!</h1>
    <div class="form-group">
      <input type="text" id="recipientName" placeholder="Имя получателя" maxlength="20">
    </div>
    <div class="form-group">
      <input type="text" id="customWish" placeholder="Ваше пожелание" maxlength="100">
    </div>
    <div class="form-group">
      <input type="text" id="hobbies" placeholder="Хобби/интересы (например, программирование, игры)" maxlength="50">
    </div>
    <div class="form-group">
      <select id="themeSelect">
        <option value="blue-purple">Сине-Фиолетовый Градиент</option>
        <option value="red-orange">Красно-Оранжевый Градиент</option>
        <option value="green-blue">Зелёно-Синий Градиент</option>
        <option value="pink-cyan">Розово-Голубой Градиент</option>
        <option value="purple-gold">Фиолетово-Золотой Градиент</option>
        <option value="teal-magenta">Бирюзово-Малиновый Градиент</option>
        <option value="sunset">Закатный Градиент</option>
      </select>
    </div>
    <div class="form-group">
      <select id="textAnimation">
        <option value="glitch">Glitch (Пиксельный сбой)</option>
        <option value="typewriter">Typewriter (Печатная машинка)</option>
        <option value="neon">Neon (Неоновое свечение)</option>
        <option value="pixel-pulse">Pixel Pulse (Пиксельный пульс)</option>
      </select>
    </div>
    <button class="btn" onclick="generateCard()">Создать Открытку!</button>
    <button class="btn" onclick="downloadCard()">Скачать Открытку</button>
    <canvas id="cardCanvas" width="600" height="400"></canvas>
    </div>

    <script src="script.js"></script>
</body>
</html>
